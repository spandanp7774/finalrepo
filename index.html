<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sneaker Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Sneaker Store</h1>
</header>

<main class="container">


  <section class="product">

    <div class="image-container">
      <img id="productImage" src="https://via.placeholder.com/400" alt="Sneaker">
    </div>

    <div class="details">
      <h2>AirMax Sneakers</h2>
      <p class="price">₹4,999</p>

      
      <h3>Color</h3>
      <label><input type="radio" name="color"> Red</label>
      <label><input type="radio" name="color"> Black</label>

      <h3>Size</h3>
      <label><input type="radio" name="size"> 7</label>
      <label><input type="radio" name="size"> 8</label>
      <label><input type="radio" name="size"> 9</label>

      <button id="cartBtn">Add to Cart</button>

    </div>

  </section>


  <section class="reviews">
    <h2>Customer Reviews</h2>
    <p>⭐⭐⭐⭐☆ - Great comfort!</p>
    <p>⭐⭐⭐⭐⭐ - Worth the price!</p>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
