<!DOCTYPE html>
<html>
<head>
  <title>Sneaker Store</title>
  
</head>
  <link rel="stylesheet" href="style.css">
<script src="script.js"></script>

<body>

<header>
  <h1>Sneaker Store</h1>
</header>

<div class="container">

  <section id="productPage">

    <h2>AirMax Sneakers</h2>

    <div class="image-box">
      <img src="https://via.placeholder.com/300" alt="Sneaker">
    </div>

    <p class="price">₹4,999</p>

    <h3>Select Color</h3>
    <label><input type="radio" name="color" value="Red"> Red</label>
    <label><input type="radio" name="color" value="Black"> Black</label>

    <h3>Select Size</h3>
    <label><input type="radio" name="size" value="7"> 7</label>
    <label><input type="radio" name="size" value="8"> 8</label>
    <label><input type="radio" name="size" value="9"> 9</label>

    <br><br>

    <button class="btn" id="cartBtn">Add to Cart</button>

    <hr>

    <h2>Customer Reviews</h2>
    <div class="reviews">
      <p>⭐⭐⭐⭐☆ - Great comfort!</p>
      <p>⭐⭐⭐⭐⭐ - Worth the price!</p>
    </div>

  </section>


  <section id="shippingPage" style="display:none;">
    <h2>Shipping Address</h2>

    <form id="shippingForm">
      <input type="text" placeholder="Full Name" required>
      <input type="text" placeholder="Address" required>
      <input type="text" placeholder="City" required>
      <input type="text" placeholder="Pincode" required>

      <button type="submit" class="btn buy">Buy Now</button>
    </form>
  </section>

  <section id="confirmationPage" style="display:none;">
    <h1>🎉 Order Confirmed!</h1>
    <p>Your sneakers will be delivered soon.</p>

    <div id="orderDetails"></div>
  </section>

</div>

<script src="script.js"></script>
</body>
</html>
